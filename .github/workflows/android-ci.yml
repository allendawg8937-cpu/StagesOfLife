
name: Android CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore and verify Gradle Wrapper JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gradle/wrapper

          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-9.3.1-wrapper.jar \
            --output gradle/wrapper/gradle-wrapper.jar

          echo "b3a875ddc1f044746e1b1a55f645584505f4a10438c1afea9f15e92a7c42ec13  gradle/wrapper/gradle-wrapper.jar" \
            | sha256sum --check --status

          echo "Official Gradle Wrapper verified."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Show Build Tool Versions
        run: |
          java -version
          ./gradlew --version

      - name: Run Unit Tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Debug APK was not created"
            find app/build/outputs -maxdepth 5 -type f -name '*.apk' -print || true
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: stages-of-life-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
