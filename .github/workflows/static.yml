
name: Deploy StagesOfLife to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angular-web/package-lock.json

      - name: Install dependencies
        working-directory: angular-web
        run: npm ci

      - name: Build Angular website
        working-directory: angular-web
        run: npx ng build --configuration production --base-href /StagesOfLife/

      - name: Verify website build
        run: |
          test -f angular-web/dist/wondering-world-web/browser/index.html
          touch angular-web/dist/wondering-world-web/browser/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: angular-web/dist/wondering-world-web/browser

  deploy:
    name: Deploy website
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
